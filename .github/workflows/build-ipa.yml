name: Build Kladz IPA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: kladz-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate app property list
        run: plutil -lint Locus/Resources/Info.plist

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Kladz for iOS
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Kladz \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/xcodebuild.log

      - name: Static analysis
        run: |
          set -o pipefail
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Kladz \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            analyze | tee build/analyze.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Kladz.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          ditto "$APP_PATH" build/ipa/Payload/Kladz.app
          (cd build/ipa && /usr/bin/zip -qry ../Kladz-unsigned.ipa Payload)
          test -s build/Kladz-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kladz-unsigned-IPA
          path: build/Kladz-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Kladz-build-log
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7


  publish-release:
    name: Publish versioned IPA
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built IPA
        uses: actions/download-artifact@v4
        with:
          name: Kladz-unsigned-IPA
          path: release-assets

      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Kladz-unsigned.ipa
          generate_release_notes: true
